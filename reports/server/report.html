<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>F# Compiler Server</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: a single reading column for context, then a full-width explorer (sticky filter bar, charts, tables). */
:root {
  --bg: #f5f6f8; --surface: #fdfdfe; --ink: #0f1720; --ink2: #4b5563; --muted: #858c97;
  --grid: #e2e5ea; --axis: #c3c8d0; --accent: #1d4f86; --band: rgba(15,23,32,.035);
  --good: #0a7f2e; --bad: #b42318; --flag: #a15c00;
  --s-baseline: #898781; --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100;
  --s5: #e87ba4; --s6: #008300; --s7: #6250d6; --s8: #e34948;
  --s9: #9b6a2f; --s10: #0f9bb0; --s11: #7a8a12; --s12: #5a6b8c;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1116; --surface: #161a21; --ink: #eef1f5; --ink2: #b8c0cc; --muted: #8a919c;
    --grid: #262b34; --axis: #3a404b; --accent: #8cbcf0; --band: rgba(255,255,255,.035);
    --good: #3fb950; --bad: #f47067; --flag: #e3a34a;
    --s-baseline: #9a9890; --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
    --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
    --s9: #c08a4a; --s10: #2bb8cc; --s11: #a3b52a; --s12: #8797b8;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1116; --surface: #161a21; --ink: #eef1f5; --ink2: #b8c0cc; --muted: #8a919c;
  --grid: #262b34; --axis: #3a404b; --accent: #8cbcf0; --band: rgba(255,255,255,.035);
  --good: #3fb950; --bad: #f47067; --flag: #e3a34a;
  --s-baseline: #9a9890; --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
  --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
  --s9: #c08a4a; --s10: #2bb8cc; --s11: #a3b52a; --s12: #8797b8;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.55 var(--f-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 48px; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
a { color: var(--accent); }
code, .mono { font-family: var(--f-mono); font-size: .9em; }
h1, h2, h3 { text-wrap: balance; line-height: 1.2; margin: 0; }
h1 { font-size: 1.75rem; font-weight: 600; letter-spacing: -.01em; }
h2 { font-size: 1.25rem; font-weight: 600; margin-top: 8px; }
h3 { font-size: 1rem; font-weight: 600; }
.wrap { max-width: 1240px; margin: 0 auto; display: flex; flex-direction: column; gap: 28px; }
.prose { max-width: 72ch; display: flex; flex-direction: column; gap: 10px; }
.prose p, .prose ul, .prose ol { margin: 0; }
.prose li + li { margin-top: 3px; }
header { padding-block: 28px 4px; display: flex; flex-direction: column; gap: 8px; }
.eyebrow { font: 500 .75rem/1 var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.sub { color: var(--ink2); }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px 32px; }
.cols > * { min-width: 0; }
dl.kv { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; margin: 0; }
dl.kv dt { color: var(--muted); font-size: .85rem; padding-top: 1px; }
dl.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.tablebox { overflow-x: auto; border: 1px solid var(--grid); border-radius: 6px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: .875rem; }
th, td { padding: 6px 10px; text-align: left; border-bottom: 1px solid var(--grid); vertical-align: top; }
th { font-weight: 500; color: var(--ink2); background: var(--band); white-space: nowrap; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; font-family: var(--f-mono); font-size: .82rem; }
tr:last-child td { border-bottom: 0; }
.sig { font-weight: 600; }
.faster { color: var(--good); } .slower { color: var(--bad); }
.flag { color: var(--flag); }
/* explorer */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg);
  padding-block: 10px; border-bottom: 1px solid var(--grid); display: flex; flex-direction: column; gap: 8px; }
.row { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
.row > label.lbl { font: 500 .72rem/1 var(--f-mono); letter-spacing: .07em; text-transform: uppercase; color: var(--muted); min-width: 92px; }
select, button { font: inherit; font-size: .875rem; color: var(--ink); background: var(--surface);
  border: 1px solid var(--axis); border-radius: 6px; padding: 5px 9px; }
button { cursor: pointer; }
button:focus-visible, select:focus-visible, .chip:focus-within { outline: 2px solid var(--accent); outline-offset: 1px; }
.seg { display: inline-flex; border: 1px solid var(--axis); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; border-radius: 0; background: var(--surface); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.seg button:disabled { color: var(--muted); cursor: not-allowed; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; min-width: 0; flex: 1; }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--axis); border-radius: 999px;
  padding: 3px 10px 3px 8px; font-size: .8rem; cursor: pointer; background: var(--surface); user-select: none; }
.chip input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.chip .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); flex: none; }
.chip.off { color: var(--muted); border-style: dashed; }
.chip.off .dot { opacity: .25; }
.link { border: 0; background: none; color: var(--accent); padding: 2px 4px; text-decoration: underline; font-size: .8rem; }
.charts { display: grid; grid-template-columns: 1fr; gap: 22px; }
.fig { background: var(--surface); border: 1px solid var(--grid); border-radius: 6px; padding: 12px 12px 8px; overflow-x: auto; }
.fig svg { display: block; width: 100%; height: auto; min-width: 560px; }
.fig .note { color: var(--muted); font-size: .8rem; margin: 6px 4px 0; }
.small-multiples { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 520px), 1fr)); gap: 14px; }
.small-multiples > .fig svg { min-width: 360px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
.tile { background: var(--surface); border: 1px solid var(--grid); border-radius: 6px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; }
.tile .k { font-size: .78rem; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.tile .v { font-size: 1.35rem; font-weight: 600; }
.tile .ci { font: .78rem var(--f-mono); color: var(--ink2); }
#tip { position: fixed; pointer-events: none; z-index: 20; background: var(--ink); color: var(--bg); font-size: .8rem;
  line-height: 1.4; padding: 7px 9px; border-radius: 5px; max-width: 340px; display: none; box-shadow: 0 4px 14px rgba(0,0,0,.18); }
#tip b { font-weight: 600; }
.empty { color: var(--muted); padding: 16px; }
@media (max-width: 520px) { .row > label.lbl { min-width: 0; width: 100%; } h1 { font-size: 1.4rem; } }
/* left navigation + collapsible sections (all report pages) */
.layout { max-width: 1320px; margin: 0 auto; display: grid; grid-template-columns: 210px minmax(0, 1fr); gap: 36px; }
.layout > .wrap { max-width: none; margin: 0; min-width: 0; }
nav.toc { position: sticky; top: 0; align-self: start; max-height: 100vh; overflow-y: auto; padding: 28px 0 16px; }
nav.toc .eyebrow { margin-bottom: 10px; }
nav.toc ol { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; counter-reset: s; }
nav.toc li { counter-increment: s; }
nav.toc a { display: block; padding: 4px 8px; border-radius: 5px; color: var(--ink2); text-decoration: none; font-size: .9rem; border-left: 2px solid transparent; }
nav.toc ol a::before { content: counter(s) ". "; color: var(--muted); font-family: var(--f-mono); font-size: .8rem; }
nav.toc a:hover { color: var(--ink); background: var(--band); }
nav.toc a.current { color: var(--ink); border-left-color: var(--accent); background: var(--band); }
nav.toc .ext { margin-top: 16px; display: flex; flex-direction: column; gap: 4px; font-size: .82rem; }
.findings-wrap { display: contents; }
section.sec { scroll-margin-top: 12px; }
section.sec > h2.sec-h { cursor: pointer; display: flex; align-items: baseline; gap: 10px; user-select: none; }
section.sec > h2.sec-h::before { content: "▸"; color: var(--muted); font-size: .9rem; transition: transform .15s; display: inline-block; width: 1em; transform: rotate(90deg); }
section.sec.collapsed > h2.sec-h::before { transform: none; }
section.sec > h2.sec-h .hint { color: var(--muted); font-size: .8rem; font-weight: 400; display: none; }
section.sec.collapsed > h2.sec-h .hint { display: inline; }
section.sec.collapsed > :not(h2) { display: none !important; }
@media (max-width: 900px) {
  .layout { grid-template-columns: minmax(0, 1fr); gap: 0; }
  nav.toc { position: static; max-height: none; padding-bottom: 0; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
<style>
/* <details> sections, as in the JIT PR report */
nav.toc .ext button { align-self: flex-start; }
main.wrap { max-width: none; margin: 0; }
details.sec { border-top: 1px solid var(--grid); padding-top: 14px; scroll-margin-top: 12px; }
details.sec > summary { cursor: pointer; list-style: none; display: flex; align-items: baseline; gap: 10px; }
details.sec > summary::-webkit-details-marker { display: none; }
details.sec > summary::before { content: "▸"; color: var(--muted); font-size: .9rem; transition: transform .15s; display: inline-block; width: 1em; }
details.sec[open] > summary::before { transform: rotate(90deg); }
details.sec > summary .hint { color: var(--muted); font-size: .8rem; font-weight: 400; }
details.sec[open] > summary .hint { display: none; }
details.sec > .body { display: flex; flex-direction: column; gap: 14px; padding: 14px 0 6px 1.6em; min-width: 0; }
details.sub > summary { cursor: pointer; color: var(--ink2); font-weight: 500; }
details.sub > .prose { margin-top: 8px; }
@media (max-width: 900px) { details.sec > .body { padding-left: 0; } }
</style>
</head>

<script src="data/report-data.js"></script>
<script>
"use strict";
const D = window.REPORT_DATA;
const $ = (id) => document.getElementById(id);
const NS = "http://www.w3.org/2000/svg";
if (!D) {
  $("subtitle").textContent = "No data: data/report-data.js is missing. Run scripts/report_server_full.py to generate it.";
  throw new Error("REPORT_DATA missing");
}

// ------------------------------------------------------------ helpers
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const M = Object.fromEntries(D.metrics.map((m) => [m.key, m]));
const fmtV = (v, key) => {
  if (v == null || isNaN(v)) return "–";
  const m = M[key] || { digits: 2, unit: "" };
  const d = m.digits;
  const s = Math.abs(v) >= 1000 && d === 0 ? Math.round(v).toLocaleString("en-US") : v.toFixed(d);
  return m.unit ? `${s} ${m.unit}` : s;
};
const fmtP = (x) => (x == null ? "–" : `${x >= 0 ? "+" : "−"}${Math.abs(x * 100).toFixed(1)}%`);
const fmtCI = (c) => (c ? `${fmtP(c.lo)} to ${fmtP(c.hi)}` : "");
const REF = D.meta.ref_config || "baseline"; // drawn in neutral gray
const configColor = (() => {
  const all = D.meta.configs.map((c) => c.id);
  const others = all.filter((c) => c !== REF);
  return (id) => (id === REF ? css("--s-baseline") : css(`--s${(others.indexOf(id) % 12) + 1}`));
})();
const slot = (i) => css(`--s${(i % 12) + 1}`);
function md(src) { // minimal markdown: headings, lists, bold, code, links, paragraphs
  const inline = (t) => esc(t).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
  const out = []; let list = null;
  const close = () => { if (list) { out.push(`</${list}>`); list = null; } };
  for (const raw of src.split("\n")) {
    const l = raw.trimEnd();
    let m;
    if (!l.trim()) { close(); continue; }
    if ((m = l.match(/^(#{1,4})\s+(.*)/))) { close(); const n = Math.min(3, m[1].length + 1); out.push(`<h${n}>${inline(m[2])}</h${n}>`); continue; }
    if ((m = l.match(/^\s*[-*]\s+(.*)/))) { if (list !== "ul") { close(); out.push("<ul>"); list = "ul"; } out.push(`<li>${inline(m[1])}</li>`); continue; }
    if ((m = l.match(/^\s*\d+\.\s+(.*)/))) { if (list !== "ol") { close(); out.push("<ol>"); list = "ol"; } out.push(`<li>${inline(m[1])}</li>`); continue; }
    close(); out.push(`<p>${inline(l)}</p>`);
  }
  close();
  return out.join("\n");
}
function el(tag, attrs = {}, parent) {
  const e = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  if (parent) parent.appendChild(e);
  return e;
}
function text(parent, x, y, s, attrs = {}) {
  const t = el("text", { x, y, "font-family": css("--f-body") || "system-ui", "font-size": 12, fill: css("--ink2"), ...attrs }, parent);
  t.textContent = s;
  return t;
}
// Tooltip
const tip = $("tip");
function bindTip(node, html) {
  node.addEventListener("pointerenter", () => { tip.innerHTML = html; tip.style.display = "block"; });
  node.addEventListener("pointermove", (e) => {
    const r = tip.getBoundingClientRect();
    let x = e.clientX + 14, y = e.clientY + 14;
    if (x + r.width > innerWidth - 8) x = e.clientX - r.width - 14;
    if (y + r.height > innerHeight - 8) y = e.clientY - r.height - 14;
    tip.style.left = x + "px"; tip.style.top = y + "px";
  });
  node.addEventListener("pointerleave", () => { tip.style.display = "none"; });
}
function niceStep(raw) {
  if (raw <= 0) return 1;
  const e = Math.pow(10, Math.floor(Math.log10(raw)));
  for (const m of [1, 2, 2.5, 5, 10]) if (raw <= m * e) return m * e;
  return 10 * e;
}
// Shared chart frame: title, subtitle, legend inside the SVG so a screenshot stands alone.
function frame(svg, w, title, subtitle, legend) {
  text(svg, 0, 18, title, { "font-size": 15, "font-weight": 600, fill: css("--ink") });
  text(svg, 0, 37, subtitle, { "font-size": 12, fill: css("--ink2") });
  let x = 0, y = 60;
  for (const it of legend) {
    const wItem = 22 + it.label.length * 6.6 + 16;
    if (x + wItem > w) { x = 0; y += 18; }
    if (it.kind === "hollow") el("circle", { cx: x + 6, cy: y - 4, r: 4.5, fill: css("--surface"), stroke: css("--muted"), "stroke-width": 1.8 }, svg);
    else if (it.kind === "rect") el("rect", { x, y: y - 10, width: 12, height: 12, rx: 2, fill: it.color, "fill-opacity": it.light ? 0.35 : 1, stroke: it.color, "stroke-width": it.light ? 1.2 : 0 }, svg);
    else if (it.kind === "whisker") { el("line", { x1: x, x2: x + 14, y1: y - 4, y2: y - 4, stroke: css("--ink"), "stroke-width": 1.4 }, svg); for (const xx of [x, x + 14]) el("line", { x1: xx, x2: xx, y1: y - 8, y2: y, stroke: css("--ink"), "stroke-width": 1.4 }, svg); }
    else el("circle", { cx: x + 6, cy: y - 4, r: 5, fill: it.color }, svg);
    text(svg, x + 18, y, it.label, { fill: css("--ink2") });
    x += wItem;
  }
  return y + 18;
}
function chip(container, id, label, on, color, onToggle, title) {
  const l = document.createElement("label");
  l.className = "chip" + (on ? "" : " off");
  if (title) l.title = title;
  l.innerHTML = `<input type="checkbox" ${on ? "checked" : ""} aria-label="${esc(label)}"><span class="dot" style="background:${color}"></span>${esc(label)}`;
  l.querySelector("input").onchange = onToggle;
  container.appendChild(l);
}
// Generic forest plot: rows = [[label, [cmp per series]]], cmp = {d, lo, hi, sig}. Title + legend live inside the SVG.
function drawForest(box, rows, series, colorOf, title, sub, xlab, tipExtra) {
  box.innerHTML = "";
  const maxLabel = Math.max(...rows.map(([p]) => p.replace("__", " · ").length));
  const W = 1000, left = Math.min(460, 24 + maxLabel * 7), right = 40, per = 13, rowH = Math.max(24, series.length * per + 10);
  const svg = el("svg", { viewBox: `0 0 ${W} 100`, role: "img", "aria-label": title });
  const top = frame(svg, W - 10, title, sub, [...series.map((c) => ({ label: c, color: colorOf(c) })), { label: "hollow = 95% CI includes 0", kind: "hollow" }]) + 6;
  const H = top + rowH * rows.length + 46;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  let lo = 0, hi = 0;
  for (const [, xs] of rows) for (const x of xs) if (x) { lo = Math.min(lo, x.lo, x.d); hi = Math.max(hi, x.hi, x.d); }
  const pad = (hi - lo) * 0.06 || 0.01; lo -= pad; hi += pad;
  const X = (v) => left + ((v - lo) / (hi - lo)) * (W - left - right);
  const step = niceStep(((hi - lo) * 100) / 6) / 100;
  for (let t = Math.ceil(lo / step) * step; t <= hi + 1e-12; t += step) {
    el("line", { x1: X(t), x2: X(t), y1: top, y2: H - 40, stroke: css("--grid"), "stroke-width": 1 }, svg);
    text(svg, X(t), H - 26, fmtP(t).replace(".0%", "%"), { "text-anchor": "middle", fill: css("--muted"), "font-size": 11 });
  }
  el("line", { x1: X(0), x2: X(0), y1: top, y2: H - 40, stroke: css("--muted"), "stroke-width": 1.2 }, svg);
  text(svg, (left + W - right) / 2, H - 8, xlab, { "text-anchor": "middle" });
  rows.forEach(([p, xs], i) => {
    const y0 = top + i * rowH;
    if (i % 2 === 0) el("rect", { x: 0, y: y0, width: W, height: rowH, fill: css("--band") }, svg);
    text(svg, left - 12, y0 + rowH / 2 + 4, p.replace("__", " · "), { "text-anchor": "end", fill: css("--ink") });
    xs.forEach((x, j) => {
      if (!x) return;
      const c = series[j], col = colorOf(c), y = y0 + 5 + per / 2 + j * per + (rowH - 10 - series.length * per) / 2;
      el("line", { x1: X(x.lo), x2: X(x.hi), y1: y, y2: y, stroke: col, "stroke-width": 2, "stroke-linecap": "round" }, svg);
      el("circle", { cx: X(x.d), cy: y, r: 4.5, fill: x.sig ? col : css("--surface"), stroke: col, "stroke-width": 2 }, svg);
      const hit = el("rect", { x: X(x.lo) - 6, y: y - 6, width: Math.max(12, X(x.hi) - X(x.lo) + 12), height: 12, fill: "transparent" }, svg);
      bindTip(hit, `<b>${esc(p)}</b><br>${esc(c)}: <b>${fmtP(x.d)}</b><br>95% CI ${fmtCI(x)}${x.sig ? "" : " (includes 0)"}` + (tipExtra ? tipExtra(p, c, x) : ""));
    });
  });
  box.appendChild(svg);
  const n = document.createElement("p"); n.className = "note";
  n.textContent = "Filled dot: the 95% CI excludes zero. Hollow dot: the difference could be noise. Hover a mark for the absolute values.";

function stackedChart(box, title, sub, rows, segs, unit, segColor) {
  box.innerHTML = "";
  if (!rows.length) { box.innerHTML = `<div class="empty">Nothing selected.</div>`; return; }
  const W = 1000, left = 170, right = 90, bh = 18, gap = 12;
  const svg = el("svg", { viewBox: `0 0 ${W} 100`, role: "img", "aria-label": title });
  const top = frame(svg, W - 10, title, sub, segs.map((s, i) => ({ label: s, color: segColor(i), kind: "rect" }))) + 6;
  const H = top + rows.length * (bh + gap) + 44;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  const max = Math.max(...rows.map((r) => r[1].reduce((a, b) => a + b, 0))) || 1;
  const X = (v) => (v / max) * (W - left - right);
  const step = niceStep(max / 6);
  for (let t = 0; t <= max + 1e-9; t += step) {
    el("line", { x1: left + X(t), x2: left + X(t), y1: top - 4, y2: H - 38, stroke: css("--grid") }, svg);
    text(svg, left + X(t), H - 24, t >= 1000 ? (t / 1000).toFixed(t % 1000 ? 1 : 0) + "K" : +t.toFixed(2), { "text-anchor": "middle", fill: css("--muted"), "font-size": 11 });
  }
  text(svg, left + (W - left - right) / 2, H - 6, unit, { "text-anchor": "middle" });
  rows.forEach(([label, vals], i) => {
    const y = top + i * (bh + gap);
    text(svg, left - 10, y + bh / 2 + 4, label, { "text-anchor": "end", fill: css("--ink") });
    let x = left; const tot = vals.reduce((a, b) => a + b, 0);
    vals.forEach((v, j) => {
      if (v <= 0) return;
      const w = Math.max(0, X(v) - 2);
      const r = el("rect", { x, y, width: w, height: bh, fill: segColor(j) }, svg);
      bindTip(r, `<b>${esc(label)}</b><br>${esc(segs[j])}: <b>${(+v.toFixed(2)).toLocaleString("en-US")}</b> ${esc(unit.split(" ")[0])} (${((v / tot) * 100).toFixed(0)}%)`);
      x += X(v);
    });
    text(svg, x + 6, y + bh / 2 + 4, `${(+tot.toFixed(1)).toLocaleString("en-US")}`, { fill: css("--ink2"), "font-family": css("--f-mono"), "font-size": 11 });
  });
  box.appendChild(svg);
}
// Findings markdown: every "## Title" part becomes its own collapsible, navigable section.
function renderFindings(box, src) {
  if (!src) return;
  const parts = []; let cur = null;
  for (const l of src.split("\n")) {
    const m = l.match(/^##\s+(.*)/);
    if (m) { cur = { title: m[1], lines: [] }; parts.push(cur); } else { if (!cur) { cur = { title: "Findings", lines: [] }; parts.push(cur); } cur.lines.push(l); }
  }
  const slug = (t) => "f-" + t.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
  box.innerHTML = parts.map((p) => `<section class="sec prose" id="${slug(p.title)}"><h2>${esc(p.title)}</h2>${md(p.lines.join("\n"))}</section>`).join("");
}
// Left navigation built from section.sec > h2; clicking a heading collapses its section; links to an id open the section.
function initNav() {
  const secs = [...document.querySelectorAll("section.sec")].filter((s) => !s.hidden && s.querySelector(":scope > h2"));
  $("toc").innerHTML = secs.map((s) => `<li><a href="#${s.id}" data-id="${s.id}">${esc(s.querySelector(":scope > h2").textContent)}</a></li>`).join("");
  for (const s of secs) {
    const h = s.querySelector(":scope > h2");
    h.classList.add("sec-h"); h.tabIndex = 0; h.setAttribute("role", "button");
    h.insertAdjacentHTML("beforeend", '<span class="hint">click to expand</span>');
    const toggle = () => { s.classList.toggle("collapsed"); h.setAttribute("aria-expanded", !s.classList.contains("collapsed")); };
    h.setAttribute("aria-expanded", !s.classList.contains("collapsed"));
    h.addEventListener("click", toggle);
    h.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(); } });
  }
  const mark = (id) => { for (const a of document.querySelectorAll("nav.toc a[data-id]")) a.classList.toggle("current", a.dataset.id === id); };
  const open = (id, scroll) => {
    const el = id && document.getElementById(id); if (!el) return;
    const s = el.closest("section.sec");
    if (s) { s.classList.remove("collapsed"); s.querySelector(":scope > h2").setAttribute("aria-expanded", true); mark(s.id); }
    if (scroll) el.scrollIntoView({ block: "start" });
  };
  document.addEventListener("click", (e) => { const a = e.target.closest('a[href^="#"]'); if (a) open(decodeURIComponent(a.getAttribute("href").slice(1)), false); });
  addEventListener("hashchange", () => open(decodeURIComponent(location.hash.slice(1)), true));
  if ($("openAll")) $("openAll").onclick = () => secs.forEach((s) => s.classList.remove("collapsed"));
  if ($("closeAll")) $("closeAll").onclick = () => secs.forEach((s) => s.classList.add("collapsed"));
  const io = new IntersectionObserver((es) => { for (const e of es) if (e.isIntersecting) mark(e.target.id); }, { rootMargin: "0px 0px -70% 0px" });
  secs.forEach((s) => io.observe(s));
  if (location.hash) open(decodeURIComponent(location.hash.slice(1)), true);
}

function openTarget(id, scroll) {
  const el = id && document.getElementById(id);

  if (scroll) el.scrollIntoView({ block: "start" });

function markCurrent(id) { for (const a of document.querySelectorAll("nav.toc a[data-id]")) a.classList.toggle("current", a.dataset.id === id); }
function wireNav() {
  for (const a of document.querySelectorAll('a[href^="#"]')) a.addEventListener("click", () => openTarget(a.getAttribute("href").slice(1), false));
  addEventListener("hashchange", () => openTarget(location.hash.slice(1), true));
  $("openAll").onclick = () => document.querySelectorAll("details").forEach((d) => (d.open = true));
  $("closeAll").onclick = () => document.querySelectorAll("details.sec").forEach((d) => (d.open = false));

  document.querySelectorAll("details.sec").forEach((d) => io.observe(d));
